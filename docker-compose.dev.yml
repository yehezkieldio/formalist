x-dev-build: &dev-build
    args:
        BUN_VERSION: ${BUN_VERSION:-1.3.5}
    target: dev

services:
    app:
        build:
            <<: *dev-build
            context: .
            dockerfile: docker/app.Dockerfile
        command: bun run dev --hostname 0.0.0.0
        environment:
            NODE_ENV: development
        volumes:
            - .:/app
            - app_node_modules:/app/node_modules
            - app_next_cache:/app/.next
            - formalist_uploads:/data/uploads

    worker:
        build:
            <<: *dev-build
            context: .
            dockerfile: docker/worker.Dockerfile
        command: bun run worker
        environment:
            NODE_ENV: development
        volumes:
            - .:/app
            - worker_node_modules:/app/node_modules
            - formalist_uploads:/data/uploads

    migrate:
        build:
            <<: *dev-build
            context: .
            dockerfile: docker/worker.Dockerfile
        command: bun run db:migrate
        environment:
            NODE_ENV: development
        volumes:
            - .:/app
            - worker_node_modules:/app/node_modules
            - formalist_uploads:/data/uploads

volumes:
    app_next_cache:
    app_node_modules:
    worker_node_modules:
